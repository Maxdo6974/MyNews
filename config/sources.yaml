# Sources d'information — Flash Info
# statut : "a_verifier" tant que le health-check du serveur ne l'a pas validé.
# Les URL n'ont PAS pu être vérifiées depuis l'environnement de développement
# (les sites de presse bloquent cet accès). Le worker les teste au premier démarrage
# et la page /test affiche le résultat. Toute URL morte sera corrigée à ce moment-là.
# groupe : sert à la règle d'indépendance (2 sources d'un même groupe = 1 seule source).
# poids : fiabilité relative utilisée dans le classement (0.5 à 1.0).

defaults:
  statut: a_verifier
  poids: 0.8
  actif: true   # false = source ignorée (gardée pour mémoire)

